# IndexNow: after each successful Vercel Production deployment, read the live
# sitemap.xml and POST its URLs to api.indexnow.org (Bing, Yandex, Naver,
# Seznam, Yep). It runs after Vercel has already finished, so it cannot affect
# the deploy, and it never goes red: a key file that is not live yet is a quiet
# skip, and any other failure is a warning (scripts/indexnow.mjs --soft).
# A manual run from the Actions tab does the same thing.
name: indexnow

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    # Vercel names its production environment "Production" (newer projects
    # append the project name), so match on the prefix. Preview deployments
    # and every non-success status are skipped.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Submit the live sitemap to IndexNow
        run: node scripts/indexnow.mjs --soft
